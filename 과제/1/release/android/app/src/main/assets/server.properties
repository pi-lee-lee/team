# DigitCam 설정 — 계약 docs/digitcam-contract.md §6 (개정 2)
#
# 이 파일은 앱에 번들되는 "기본값" 이다. 앱을 처음 실행하면 아래 경로로 복사되고,
# 그 뒤로는 복사본이 이 파일을 덮어쓴다.
#
#   /sdcard/Android/data/com.example.digitcam/files/server.properties
#
# 서버 IP 나 임계값을 바꾸려면 앱을 다시 빌드하지 말고 복사본을 고친 뒤
# 화면의 "설정 다시 읽기" 버튼을 누른다.
#
#   adb push server.properties /sdcard/Android/data/com.example.digitcam/files/server.properties
#
# 알 수 없는 키는 무시된다. 값이 깨졌으면 기본값으로 돌아가고 화면에 경고가 뜬다.

# 비어 있으면 전송하지 않고 화면에 "서버 미설정" 을 표시한다.
server.host=
# 주차장 서버의 폰 포트(PORT_PHONE) 다 — 정본은 docs/net/SPEC-camera-pull.md §0.
#
# 데스크톱 시험 수신기(docs/digitcam-contract.md)에 붙일 때는 5500 으로 바꾼다.
# 두 대상이 서로 다른 포트를 쓰므로 여기 적을 수 있는 값은 하나뿐이고, 실제로 붙을
# 주차장 서버를 기본값으로 둔다. (5500 의 유래: 5000 은 macOS AirPlay 수신기가 점유한다)
server.port=8911

# json | plain
server.format=json

# on_fresh(기본) | every_stable_frame
# on_fresh 는 네이티브가 주는 fresh=true(안정값의 상승 엣지)에서만 보낸다.
send.mode=on_fresh

# 연타 방지 하한. on_fresh 에서도 이 간격은 지킨다.
send.min_interval_ms=1000

reconnect.interval_ms=3000
socket.connect_timeout_ms=3000
socket.keepalive=true

# ---------------------------------------------------------------------------
# 카메라 pull — 서버가 SHOOT,<요청번호> 를 내려보내면 촬영해서 번호판을 올린다.
# 정본: docs/net/SPEC-camera-pull.md · 앱 쪽 결정: docs/android/SPEC-camera-pull-app.md
# ---------------------------------------------------------------------------

# 🔴 **촬영 콜백 워치독** — 인식 시한이 아니다. 인식은 시한으로 안 끊는다
#
# ❌ 옛 키 `camera.shot_timeout_ms` 는 **폐기됐다**(2026-08-27 완주 설계).
#    그 키가 있으면 앱이 경고를 띄운다. **지워라** — 아무 효과가 없다.
#
# 왜 폐기했나 : 인식이 10초대인데 시한이 8000ms 여도 거의 항상 졌다. 그리고 시한이
#    지나 대기를 닫으면 **도는 인식이 끝났을 때 그 결과가 버려졌다** — 10초를 다 쓰고
#    답만 사라진다. 실기에서 관측됐다(늦게 도착한 번호 4건).
#
# 이 키가 잡는 것 : `takePicture` 의 성공·실패 콜백이 **둘 다 안 오는** 경우.
#    그러면 셔터가 CAPTURING 에 영원히 갇혀 **이후 모든 요청이 무시된다.**
# 🔑 인식이 느린 것과 콜백이 안 오는 것은 **다른 고장**이다. 한 상수로 다루면 둘 다 못 다룬다.
#
# ⚠ **추정값이다.** 콜백이 얼마나 늦을 수 있는지 안 쟀다. 크게 잡은 것은 의도다 —
#    작으면 느린 촬영을 고장으로 오인하고, **자주 짖는 워치독은 결국 꺼진다.**
# 하한 5000. 비우면 30000.
camera.capture_watchdog_ms=30000

# ---------------------------------------------------------------------------
# 🔴 인식 입력의 장축 상한 — **인식률과 메모리를 고르는 손잡이다** (2026-08-25 사용자 요구)
#
# 앱이 인식기에 넘기기 전에 그림을 이 크기로 줄인다. 리빌드 없이 여기서 바꾼다.
# 범위 640~4096. 벗어나면 기본값으로 돌아가고 화면에 경고가 뜬다.
#
# ★ 짝이 되는 축이 하나 더 있다 — 아래 `vision.ocr_det_limit`(네이티브 소유).
#   🔑 **둘은 곱으로 작동한다.** 어느 한쪽만 올려서는 최고 성적이 안 나온다.
#
#   camera.max_edge | vision.ocr_det_limit | 실촬영 정답 | 오답 | 프레임 ms | RSS 피크
#   ----------------|----------------------|-------------|------|-----------|----------
#         960       |         960          |    11/15    |  0   |     -     |    -
#      ** 1600 **   |      ** (기본) **    |  **12/15**  |  0   |   344.8   |  342 MiB   ← 지금
#        1600       |         1600         |    12/15    |  0   |   744.5   |  653 MiB
#        4032       |         1600         |  **13/15**  |  0   |     -     |  646 MiB
#
#   (에뮬 Pixel_8_API_35 arm64 실측 · 표본 samples/plates/new 15장 · 정답 123바9898)
#   ⚠ 기본값은 **안전한 쪽**이다. 인식률을 원하면 마지막 줄 조합으로 바꾼다:
#       camera.max_edge=4032   +   vision.ocr_det_limit=1600
#   🔑 RSS 646 MiB 는 **2GB 기기에서도 안 죽은 수**다(사망 0건 실측). 8GB 기준이면 여유가 크다
# ---------------------------------------------------------------------------
camera.max_edge=1600

# 촬영본을 몇 장까지 남기나. 넘으면 오래된 것부터 지운다.
#   /sdcard/Android/data/com.example.digitcam/files/shots/shot-<요청번호>.jpg
#
# 왜 남기나 — 인식이 실패했을 때 "인식기가 못 읽었다" 와 "이상한 사진을 찍었다" 는
# 값만으로 구분되지 않는다. 그 사진이 있어야 갈린다.
# ⚠ 추정값이다. 촬영본 한 장의 크기를 실기에서 재지 않았다(하한 1).
camera.shot_keep_files=50

# ---------------------------------------------------------------------------
# 아래 vision.* 는 Kotlin 이 해석하지 않는다. 이 줄들을 문자열 그대로 모아
# DigitVision.nativeConfigure 로 넘기고, 값의 의미는 전부 C++ 가 정한다.
# 그래서 여기에 키를 추가해도 Kotlin 을 고칠 필요가 없다.
# ---------------------------------------------------------------------------

# 문자별 최소 신뢰도의 하한. 미만이면 reason=low_conf 로 버린다.
vision.min_confidence=0.70

# 같은 값이 연속 몇 프레임이면 stable 로 볼지.
vision.stable_frames=3

# 이 값 이하이면 '정지'.
#
# ⚠ 단위가 바뀌었다(REQ-0014). 예전에는 평균 프레임 차분(0~255)이었고 지금은
# **이동 화소 수**(160×120 축소 프레임 기준)다. 그래서 0.60 이 아니라 2.0 이다.
# 옛 값을 그대로 두면 가만히 든 폰에서도 계속 '움직임' 으로 잡혀 인식이 아예 안 된다
# (내가 실측한 정지 상태 카메라의 옛 motion 이 1.6~3.3 이었다 — 임계 0.60 을 늘 넘었다).
# 새 눈금: 가만히 들고 있으면 0~2, 실제로 움직이면 2 이상.
vision.motion_threshold=2.0

# 정지로 인정하기까지 필요한 연속 프레임 수.
vision.still_frames=3

# 선명도 하한. 미만이면 reason=blurry.
#
# ⚠ 60 이 아니라 40 이다. REQ-0011/0012 에서 sharp 의 **의미와 눈금이 바뀌었다** —
# 예전에는 라플라시안 분산(수백~수만)이었고 지금은
# min(mean|Sobel_x|, mean|Sobel_y|) / stddev × 100 (대략 12~79) 이다.
# 예전 눈금의 60 을 그대로 두면 새 눈금에서는 너무 높아서, 읽혀야 하는 번호판이
# blurry 로 잘린다(seunghap-band 52.4 · hires-dark 58.5 · seunghap-tilt 54.3).
vision.min_sharpness=40

# 번호판 폭 / 프레임 폭 최소. 너무 멀리 있는 번호판을 버린다.
vision.min_plate_width_ratio=0.25

# auto | new | old
vision.plate_format=auto

# true 면 움직임·선명도 게이트를 끈다(디버그용).
vision.gate_bypass=false

# ---------------------------------------------------------------------------
# 표준 인식 경로(PP-OCR 검출 + CRNN/CTC)의 손잡이 셋 — **일부러 여기 안 적었다**
#
#   vision.ocr_enabled         기본 true   표준 경로를 쓸지
#   vision.ocr_det_limit       기본 960    검출망 입력 장축 상한
#   vision.ocr_min_confidence  기본 0.85   이 미만 판독은 버린다(값없음)
#
# 🔴 **적으면 그 값이 네이티브 기본값을 덮는다.** 지금 기본값은 cpp 가 실측으로 고른 것이라,
#    여기 박아 두면 나중에 그쪽이 기본값을 바꿔도 **이 파일이 이겨서 옛 값에 묶인다.**
#    그래서 비워 둔다 — 비어 있는 것이 "기본값을 따른다" 는 뜻이다.
#
# 🔑 스윕하거나 시험할 때는 **외부 설정 파일에 적어라.** 리빌드가 필요 없다:
#    adb push server.properties /sdcard/Android/data/com.example.digitcam/files/server.properties
#    → 화면의 "설정 다시 읽기"
#    (Kotlin 은 vision. 접두면 모르는 키도 그대로 통과시킨다 — 코드 변경이 필요 없다)
#
# 🔑 아래 셋을 **값 없이** 적어 둔 이유 — 두 성질을 다 얻으려는 것이다 (REQ-0400):
#    · 주석(#)으로만 두면 `Properties.load` 가 그 줄을 버려서 **설정 화면에 키가 안 뜬다.**
#      그러면 조작자가 "그런 키가 없다"고 결론하거나 손으로 적다가 철자를 틀린다(틀려도 조용하다)
#    · 값을 적으면 이 파일이 **네이티브 기본값을 덮어** 나중에 그쪽이 바꿔도 옛 값에 묶인다
#    → **빈 값**이면 키는 보이고 값은 안 묶인다. 네이티브의 parse_*("") 가 전부 false 라
#      `configure()` 가 그 키를 건드리지 않는다(cpp 확인 · digit_pipeline.cpp:65·78·91)
# ⚠ **빈 칸은 "꺼짐" 이 아니라 "기본값을 따른다" 는 뜻이다.** 값을 적으면 그때부터 이 파일이 이긴다
# ---------------------------------------------------------------------------
vision.ocr_enabled=
vision.ocr_det_limit=
vision.ocr_min_confidence=
