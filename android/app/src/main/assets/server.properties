# DigitCam 설정 — 계약 docs/digitcam-contract.md §6 (개정 2)
#
# 이 파일은 앱에 번들되는 "기본값" 이다. 앱을 처음 실행하면 아래 경로로 복사되고,
# 그 뒤로는 복사본이 이 파일을 덮어쓴다.
#
#   /sdcard/Android/data/com.example.digitcam/files/server.properties
#
# 서버 IP 나 임계값을 바꾸려면 앱을 다시 빌드하지 말고 복사본을 고친 뒤
# 화면의 "설정 다시 읽기" 버튼을 누른다.
#
#   adb push server.properties /sdcard/Android/data/com.example.digitcam/files/server.properties
#
# 알 수 없는 키는 무시된다. 값이 깨졌으면 기본값으로 돌아가고 화면에 경고가 뜬다.

# 비어 있으면 전송하지 않고 화면에 "서버 미설정" 을 표시한다.
server.host=
# 5000 이 아니라 5500 이다(계약 개정). macOS 의 AirPlay 수신기(ControlCenter)가 5000 을
# 점유하고 있어서, 그대로 두면 테스트 서버가 바인드에 실패하거나 앱이 엉뚱한 프로세스에
# 붙어 "전송은 되는데 서버 로그가 비는" 상태가 된다.
server.port=5500

# json | plain
server.format=json

# on_fresh(기본) | every_stable_frame
# on_fresh 는 네이티브가 주는 fresh=true(안정값의 상승 엣지)에서만 보낸다.
send.mode=on_fresh

# 연타 방지 하한. on_fresh 에서도 이 간격은 지킨다.
send.min_interval_ms=1000

reconnect.interval_ms=3000
socket.connect_timeout_ms=3000
socket.keepalive=true

# ---------------------------------------------------------------------------
# 아래 vision.* 는 Kotlin 이 해석하지 않는다. 이 줄들을 문자열 그대로 모아
# DigitVision.nativeConfigure 로 넘기고, 값의 의미는 전부 C++ 가 정한다.
# 그래서 여기에 키를 추가해도 Kotlin 을 고칠 필요가 없다.
# ---------------------------------------------------------------------------

# 문자별 최소 신뢰도의 하한. 미만이면 reason=low_conf 로 버린다.
vision.min_confidence=0.70

# 같은 값이 연속 몇 프레임이면 stable 로 볼지.
vision.stable_frames=3

# 이 값 이하이면 '정지'.
#
# ⚠ 단위가 바뀌었다(REQ-0014). 예전에는 평균 프레임 차분(0~255)이었고 지금은
# **이동 화소 수**(160×120 축소 프레임 기준)다. 그래서 0.60 이 아니라 2.0 이다.
# 옛 값을 그대로 두면 가만히 든 폰에서도 계속 '움직임' 으로 잡혀 인식이 아예 안 된다
# (내가 실측한 정지 상태 카메라의 옛 motion 이 1.6~3.3 이었다 — 임계 0.60 을 늘 넘었다).
# 새 눈금: 가만히 들고 있으면 0~2, 실제로 움직이면 2 이상.
vision.motion_threshold=2.0

# 정지로 인정하기까지 필요한 연속 프레임 수.
vision.still_frames=3

# 선명도 하한. 미만이면 reason=blurry.
#
# ⚠ 60 이 아니라 40 이다. REQ-0011/0012 에서 sharp 의 **의미와 눈금이 바뀌었다** —
# 예전에는 라플라시안 분산(수백~수만)이었고 지금은
# min(mean|Sobel_x|, mean|Sobel_y|) / stddev × 100 (대략 12~79) 이다.
# 예전 눈금의 60 을 그대로 두면 새 눈금에서는 너무 높아서, 읽혀야 하는 번호판이
# blurry 로 잘린다(seunghap-band 52.4 · hires-dark 58.5 · seunghap-tilt 54.3).
vision.min_sharpness=40

# 번호판 폭 / 프레임 폭 최소. 너무 멀리 있는 번호판을 버린다.
vision.min_plate_width_ratio=0.25

# auto | new | old
vision.plate_format=auto

# true 면 움직임·선명도 게이트를 끈다(디버그용).
vision.gate_bypass=false
